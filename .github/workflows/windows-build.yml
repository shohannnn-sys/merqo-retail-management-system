name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 0.1.0)"
        required: false
        default: ""
  push:
    branches: ["main", "arena/**"]
    paths:
      - "retvia/**"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/windows-build.yml"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build EXE + installer and verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Stamp version
        if: ${{ github.event.inputs.version != '' }}
        run: python tools/set_version.py "${{ github.event.inputs.version }}"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import retvia; print(retvia.__version__)")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Retvia $VERSION"

      - name: Generate an EPHEMERAL signing key for build verification
        shell: bash
        run: |
          python tools/ci_license.py \
            --public-out retvia/assets/license_public_key.json \
            --license-out build/ci-test-license.txt \
            --bind-hardware
          echo "NOTE: production releases must inject the owner's real public key."

      - name: Build the application (PyInstaller, one-folder)
        run: pyinstaller packaging/retvia.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=..\dist\Retvia" "/DOutputDir=..\dist\installer" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "RetviaInstall"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target","/LOG=install.log" -Wait
          $exe = Join-Path $target "Retvia.exe"
          if (-not (Test-Path $exe)) { throw "Retvia.exe was not installed" }
          echo "INSTALL_DIR=$target" >> $env:GITHUB_ENV
          echo "INSTALL_EXE=$exe" >> $env:GITHUB_ENV

      - name: Verify the installed application
        shell: pwsh
        run: |
          python tools/verify_install.py `
            --exe "$env:INSTALL_EXE" `
            --screenshots build/installed-screenshots `
            --license-file build/ci-test-license.txt `
            --data-dir "$env:RUNNER_TEMP\retvia-user-data"
          if ($LASTEXITCODE -ne 0) { throw "Installed-application verification failed" }

      - name: Seed data, then verify uninstall preserves it
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "retvia-user-data"
          $marker = Join-Path $data "data\keep-me.txt"
          Set-Content -Path $marker -Value "business data must survive uninstall"
          $uninstall = Get-ChildItem "$env:INSTALL_DIR" -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstall) { throw "Uninstaller not found" }
          Start-Process -FilePath $uninstall.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$env:INSTALL_EXE") { throw "Application was not removed" }
          if (-not (Test-Path $marker)) { throw "UNINSTALL DESTROYED USER DATA" }
          if (-not (Test-Path (Join-Path $data "data\retvia.db"))) { throw "UNINSTALL DESTROYED THE DATABASE" }
          echo "Uninstall removed the program and preserved all business data."

      - name: Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/checksums | Out-Null
          Get-ChildItem dist/installer/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii -Append dist/checksums/SHA256SUMS.txt
          }
          Get-Content dist/checksums/SHA256SUMS.txt

      - name: Package the portable build
        shell: pwsh
        run: Compress-Archive -Path dist/Retvia/* -DestinationPath "dist/Retvia-${{ steps.version.outputs.value }}-windows-portable.zip"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: retvia-windows-installer
          path: |
            dist/installer/*.exe
            dist/checksums/SHA256SUMS.txt
          retention-days: 30

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: retvia-windows-portable
          path: dist/*-windows-portable.zip
          retention-days: 30

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-app-screenshots
          path: build/installed-screenshots
          retention-days: 30

      - name: Remove the ephemeral key before anything is published
        if: always()
        shell: bash
        run: rm -f retvia/assets/license_public_key.json
